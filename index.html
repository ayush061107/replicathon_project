<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Replicathon1</title>
</head>
<body>
    <header>
        <img width="110" alt="logo" src="assets/logo.png">
        <span id="navigation">
            Home Products Contact 
            <span class="buttons">
                <b>Place order</b><img alt="arrow" width="20" src="assets/placeOrder.svg">
            </span>
        </span>
    </header>

    <section align="center">
        <button class="buttons"><b>Products</b></button>
        <button class="buttons" style="background: #ffffff55">Custom</button>
    </section><br><br>

    <section class="container">
        <div class="leftcontent">
            <h2>FIND YOUR<br>GREATNESS</h2>
            <p>Built for speed and confidence, every pair combines premium materials and bold design. Engineered for comfort, made for movement.</p>
        </div>

        <h1 class="bgtext">HYPE</h1>
        <img src="assets/shoe.png" alt="Sneaker" class="shoe">

        <div class="rightcontent">
            <span class="colortitle">Choose Your Color</span>
            <div class="coloroptions">
                <span class="colordot cyan"></span>
                <span class="colordot orange activecolor"></span>
                <span class="colordot pink"></span>
            </div>
            <div class="sizeoptions">
                <span class="sizedot">40</span>
                <span class="sizedot">42</span>
                <span class="sizedot">44</span>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="socials">
            <img src="assets/instagram.svg" alt="Instagram" width="18">
            <img src="assets/facebook.svg" alt="Facebook" width="18">
            <img src="assets/pinterest.svg" alt="Pinterest" width="18">
            <img src="assets/youtube.svg" alt="YouTube" width="18">
        </div>

        <div class="centersubtitle">
            <span class="subline"></span>
            <span>SNEAKERS FOR MORE</span>
            <span class="subline"></span>
        </div>

        <button class="buttons">
            <b>See all products</b><img alt="arrow" width="20" src="assets/placeOrder.svg">
        </button>
    </footer>
</body>
</html>
